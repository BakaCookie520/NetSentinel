services:
  app:
    image: ${NETSENTINEL_IMAGE:-ghcr.nju.edu.cn/bakacookie520/netsentinel:latest}
    container_name: NetSentinel
    init: true
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_DEMO_MODE: "false"
    command: ["node", "apps/api/dist/main.js"]
    environment:
      TRUST_PROXY: ${TRUST_PROXY:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PORT: 3000
      NETSENTINEL_DATA_DIR: /app/data
      NETSENTINEL_MASTER_KEY: ${NETSENTINEL_MASTER_KEY:-}
      DATABASE_URL: ${DATABASE_URL:-}
      WEB_ORIGIN: ${WEB_ORIGIN:-}
      REDIS_URL: ${REDIS_URL:-}
      NETSENTINEL_BACKUP_UPLOAD_MAX_BYTES: ${NETSENTINEL_BACKUP_UPLOAD_MAX_BYTES:-1073741824}
      NETSENTINEL_BACKUP_EXPANDED_MAX_BYTES: ${NETSENTINEL_BACKUP_EXPANDED_MAX_BYTES:-10737418240}
      NETSENTINEL_RESTORE_DRAIN_TIMEOUT_MS: ${NETSENTINEL_RESTORE_DRAIN_TIMEOUT_MS:-600000}
    ports:
      - "${NETSENTINEL_HTTP_PORT:-8080}:3000"
    volumes:
      - app-data:/app/data
    cap_add: ["NET_RAW"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  app-data:
